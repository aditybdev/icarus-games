<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2FBF5"/>
      <stop offset="1" stop-color="#D9F0E2"/>
    </linearGradient>
    <linearGradient id="paperA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9E6C9"/>
      <stop offset="1" stop-color="#8ED3A8"/>
    </linearGradient>
    <linearGradient id="paperB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6D9FF"/>
      <stop offset="1" stop-color="#C3AEF0"/>
    </linearGradient>
    <linearGradient id="paperC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1E9FF"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- origami kite / diamond, faceted like folded paper -->
  <g transform="translate(512 512)">
    <!-- back facet -->
    <path d="M0 -300 L236 40 L0 300 Z" fill="url(#paperB)"/>
    <path d="M0 -300 L-236 40 L0 300 Z" fill="url(#paperA)"/>
    <!-- front fold overlay -->
    <path d="M0 -300 L236 40 L0 40 Z" fill="url(#paperC)" opacity="0.92"/>
    <path d="M0 -300 L-236 40 L0 40 Z" fill="#FFFFFF" opacity="0.75"/>
    <!-- fold creases -->
    <path d="M0 -300 L0 300" stroke="#8A7BB8" stroke-width="10" opacity="0.35"/>
    <path d="M-236 40 L236 40" stroke="#8A7BB8" stroke-width="10" opacity="0.35"/>
    <path d="M0 -300 L236 40 L0 300 L-236 40 Z" fill="none" stroke="#7FA98F" stroke-width="14" stroke-linejoin="round" opacity="0.5"/>
    <!-- lower facets shading -->
    <path d="M0 40 L236 40 L0 300 Z" fill="#9F86D8" opacity="0.35"/>
    <path d="M0 40 L-236 40 L0 300 Z" fill="#6FBF93" opacity="0.35"/>
    <!-- highlight -->
    <path d="M0 -300 L-120 -130 L0 40 Z" fill="#FFF" opacity="0.35"/>
  </g>

  <!-- dotted fold guide, brand motif -->
  <path d="M196 800 H828" stroke="#8A7BB8" stroke-width="14" stroke-linecap="round" stroke-dasharray="4 42" opacity="0.6"/>
</svg>
