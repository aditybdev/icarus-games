<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#8fd4ff" />
    <link rel="icon" href="data:," />
    <title>Tissue Rush</title>
    <script src="https://www.youtube.com/game_sdk/v0"></script>
    <style>
      :root {
        --sky: #7ec8ff;
        --sky-deep: #3d9ede;
        --mint: #6fe3b0;
        --mint-deep: #34bd85;
        --ink: #1d4e6b;
        --ink-soft: #4d7d99;
        --card: rgba(255, 255, 255, 0.94);
        --shadow: 0 10px 30px rgba(45, 110, 160, 0.2);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #bfe8ff;
        color: var(--ink);
        font-family:
          ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }

      #stage {
        position: fixed;
        inset: 0;
      }

      #stage canvas {
        display: block;
        touch-action: none;
      }

      /* ---------- shared ---------- */

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        min-width: 52px;
        padding: 0 28px;
        border: none;
        border-radius: 999px;
        font: inherit;
        font-size: 18px;
        font-weight: 800;
        color: #fff;
        background: var(--sky);
        box-shadow: 0 6px 0 var(--sky-deep), var(--shadow);
        cursor: pointer;
        transition: transform 0.08s ease, box-shadow 0.08s ease;
      }

      .btn:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 var(--sky-deep), var(--shadow);
      }

      .btn-secondary {
        background: var(--mint);
        box-shadow: 0 6px 0 var(--mint-deep), var(--shadow);
        color: #0e5c3d;
      }

      .btn-secondary:active {
        box-shadow: 0 2px 0 var(--mint-deep), var(--shadow);
      }

      .btn-big {
        width: 100%;
        font-size: 19px;
        min-height: 56px;
      }

      .chip {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        padding: 8px 16px;
        min-height: 48px;
        border-radius: 999px;
        background: var(--card);
        box-shadow: var(--shadow);
        font-size: 16px;
        font-weight: 800;
      }

      .icon-btn {
        width: 52px;
        height: 52px;
        border: none;
        border-radius: 16px;
        background: var(--card);
        box-shadow: var(--shadow);
        color: var(--ink);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .screen {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top, 0px) + 16px)
          calc(env(safe-area-inset-right, 0px) + 16px)
          calc(env(safe-area-inset-bottom, 0px) + 16px)
          calc(env(safe-area-inset-left, 0px) + 16px);
        background: rgba(198, 235, 255, 0.66);
      }

      .card {
        width: min(92vw, 380px);
        max-height: 100%;
        overflow-y: auto;
        padding: 26px 22px;
        border-radius: 28px;
        background: var(--card);
        box-shadow: var(--shadow);
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      [hidden] {
        display: none !important;
      }

      /* ---------- menu ---------- */

      .logo {
        margin: 0;
        font-size: clamp(44px, 13vw, 64px);
        font-weight: 900;
        letter-spacing: -1.5px;
        line-height: 1.05;
        color: var(--sky-deep);
        text-shadow:
          0 3px 0 #fff,
          0 6px 0 #bfe3ff,
          0 10px 18px rgba(61, 158, 222, 0.3);
      }

      .logo span {
        color: var(--mint-deep);
        text-shadow:
          0 3px 0 #fff,
          0 6px 0 #c8f3e0,
          0 10px 18px rgba(52, 189, 133, 0.3);
      }

      .tagline {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        color: var(--ink-soft);
      }

      #size-row {
        display: flex;
        gap: 10px;
      }

      .size-btn {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        min-height: 96px;
        padding: 10px 4px;
        border: none;
        border-radius: 22px;
        background: #eaf7ff;
        box-shadow: 0 5px 0 #c2e4f7, var(--shadow);
        color: var(--ink);
        font: inherit;
        cursor: pointer;
        transition: transform 0.08s ease, box-shadow 0.08s ease;
      }

      .size-btn:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #c2e4f7, var(--shadow);
      }

      .size-num {
        font-size: 30px;
        font-weight: 900;
        color: var(--sky-deep);
      }

      .size-label {
        font-size: 14px;
        font-weight: 800;
        color: var(--ink-soft);
      }

      .size-best {
        min-height: 16px;
        font-size: 14px;
        font-weight: 700;
        color: var(--mint-deep);
      }

      /* Medal dot earned on this size (best-time medal). */
      .medal-dot {
        width: 13px;
        height: 13px;
        margin-top: 2px;
        border-radius: 50%;
        background: transparent;
        box-shadow: inset 0 0 0 2px #d5e7f2;
      }

      .medal-dot.bronze {
        background: radial-gradient(circle at 35% 30%, #e8b285, #b0703a);
        box-shadow: 0 1px 3px rgba(120, 70, 20, 0.4);
      }

      .medal-dot.silver {
        background: radial-gradient(circle at 35% 30%, #eef4fa, #9fb2c4);
        box-shadow: 0 1px 3px rgba(90, 110, 130, 0.4);
      }

      .medal-dot.gold {
        background: radial-gradient(circle at 35% 30%, #ffe9a8, #e3a62c);
        box-shadow: 0 1px 4px rgba(200, 140, 20, 0.5);
      }

      /* Box-skin picker dots. */
      #skin-row {
        display: flex;
        gap: 12px;
        justify-content: center;
        align-items: center;
        min-height: 32px;
      }

      .skin-dot {
        /* 30px visual dot inside a 44px touch target (transparent border). */
        width: 44px;
        height: 44px;
        padding: 0;
        border: 7px solid transparent;
        border-radius: 50%;
        background-clip: padding-box;
        cursor: pointer;
        box-shadow: inset 0 -4px 6px rgba(0, 0, 0, 0.12);
      }

      .skin-dot.selected {
        outline: 3px solid var(--sky-deep);
        outline-offset: 2px;
      }

      .skin-dot.locked {
        opacity: 0.3;
        filter: grayscale(0.9);
        cursor: default;
        box-shadow: none;
      }

      #menu-stats {
        margin: 0;
        font-size: 14px;
        font-weight: 800;
        color: var(--ink-soft);
      }

      .btn-blitz {
        background: #ffd166;
        box-shadow: 0 6px 0 #dfa63a, var(--shadow);
        color: #6e4a00;
      }

      .btn-blitz:active {
        box-shadow: 0 2px 0 #dfa63a, var(--shadow);
      }

      /* Daily Sprint entry (Icarus Daily): sunset-gold full-width button. */
      .btn-daily {
        gap: 10px;
        background: #ff9f6e;
        box-shadow: 0 6px 0 #d9733a, var(--shadow);
        color: #5c2a00;
      }

      .btn-daily:active {
        box-shadow: 0 2px 0 #d9733a, var(--shadow);
      }

      /* Small pill tags on the daily button: streak flame / done badge. */
      .daily-tag {
        padding: 3px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.55);
        font-size: 14px;
        font-weight: 800;
        white-space: nowrap;
      }

      /* HUD chip shown while a Daily Sprint round is active. */
      #daily-chip {
        position: absolute;
        top: calc(env(safe-area-inset-top, 0px) + 68px);
        left: calc(env(safe-area-inset-left, 0px) + 12px);
        min-height: 36px;
        padding: 6px 14px;
        font-size: 14px;
        font-weight: 900;
        letter-spacing: 1px;
        color: #d9733a;
        pointer-events: none;
      }

      /* Daily results lines (best today + current streak). */
      #results-daily-best {
        font-size: 15px;
        font-weight: 800;
        color: #d9733a;
      }

      #results-daily-streak {
        font-size: 15px;
        font-weight: 800;
        color: var(--ink-soft);
      }

      .howto {
        margin: 2px 0 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--ink-soft);
      }

      /* ---------- countdown ---------- */

      #count-size {
        margin: 0;
        font-size: 18px;
        font-weight: 800;
        color: var(--ink-soft);
      }

      #count-num {
        margin: 0;
        font-size: clamp(84px, 24vw, 128px);
        font-weight: 900;
        line-height: 1;
        color: var(--sky-deep);
        text-shadow: 0 4px 0 #fff, 0 8px 16px rgba(61, 158, 222, 0.3);
      }

      #count-hint {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        color: var(--ink-soft);
      }

      /* ---------- HUD ---------- */

      #hud {
        position: fixed;
        inset: 0;
        z-index: 20;
        pointer-events: none;
      }

      #hud > * {
        pointer-events: auto;
      }

      #topbar {
        position: absolute;
        top: calc(env(safe-area-inset-top, 0px) + 12px);
        left: calc(env(safe-area-inset-left, 0px) + 12px);
        right: calc(env(safe-area-inset-right, 0px) + 12px);
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        pointer-events: none;
      }

      #topbar > * {
        pointer-events: auto;
      }

      #remaining-chip {
        font-size: 22px;
      }

      #remaining {
        font-size: 30px;
        font-weight: 900;
        color: var(--sky-deep);
        line-height: 1;
      }

      .chip-sub {
        font-size: 14px;
        font-weight: 800;
        color: var(--ink-soft);
      }

      #timer {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        font-variant-numeric: tabular-nums;
        font-size: 20px;
        color: var(--ink);
      }

      /* Mini HUD chips under the timer: live streak count + pace delta. */
      #hud > .hud-chip {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        min-height: 36px;
        padding: 6px 14px;
        font-size: 16px;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        white-space: nowrap;
      }

      #streak-chip {
        top: calc(env(safe-area-inset-top, 0px) + 68px);
        color: #ef8b1f;
      }

      #streak-chip.hot {
        color: #ff5e7a;
      }

      #streak-chip.bump {
        animation: streak-bump 0.25s ease-out;
      }

      /* Mercy spent / chain broken: flash the chip so the cost is legible. */
      #streak-chip.flash {
        animation: streak-flash 0.45s ease-out;
      }

      @keyframes streak-flash {
        0%,
        100% {
          background: var(--card);
        }
        35%,
        70% {
          background: #ffd9e0;
          color: #ff5e7a;
          transform: translateX(-50%) scale(1.12);
        }
      }

      @keyframes streak-bump {
        0% {
          transform: translateX(-50%) scale(0.7);
        }
        60% {
          transform: translateX(-50%) scale(1.18);
        }
        100% {
          transform: translateX(-50%) scale(1);
        }
      }

      #pace-chip {
        top: calc(env(safe-area-inset-top, 0px) + 114px);
        font-size: 15px;
        color: var(--mint-deep);
      }

      #pace-chip.behind {
        color: #ff5e7a;
      }

      #streak-pop {
        position: fixed;
        left: 50%;
        top: 30%;
        transform: translate(-50%, -50%);
        z-index: 25;
        pointer-events: none;
        font-size: clamp(36px, 10vw, 56px);
        font-weight: 900;
        color: #ff9f43;
        text-shadow: 0 3px 0 #fff, 0 8px 16px rgba(255, 159, 67, 0.45);
        opacity: 0;
        white-space: nowrap;
      }

      #streak-pop.hot {
        color: #ff5e7a;
        text-shadow: 0 3px 0 #fff, 0 8px 16px rgba(255, 94, 122, 0.5);
      }

      #streak-pop.show {
        animation: streak-pop 0.75s ease-out forwards;
      }

      @keyframes streak-pop {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.5);
        }
        20% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.15);
        }
        45% {
          opacity: 1;
          transform: translate(-50%, -58%) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -85%) scale(1);
        }
      }

      /* ---------- results ---------- */

      #results-title {
        margin: 0;
        font-size: 30px;
        font-weight: 900;
      }

      #results-time {
        font-size: clamp(48px, 14vw, 64px);
        font-weight: 900;
        font-variant-numeric: tabular-nums;
        color: var(--sky-deep);
        line-height: 1.05;
      }

      #results-avg {
        font-size: 16px;
        font-weight: 700;
        color: var(--ink-soft);
      }

      #results-size {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #8fb3c7;
      }

      #results-delta {
        font-size: 16px;
        font-weight: 800;
      }

      #results-delta.ahead {
        color: var(--mint-deep);
      }

      #results-delta.behind {
        color: #ff5e7a;
      }

      #results-best {
        min-height: 22px;
        font-size: 15px;
        font-weight: 800;
        color: var(--ink-soft);
      }

      #results-best.new-best {
        color: #ff5e7a;
      }

      #results-medal {
        font-size: 22px;
        font-weight: 900;
      }

      #results-medal.show {
        animation: medal-pop 0.6s cubic-bezier(0.2, 1.6, 0.4, 1);
      }

      @keyframes medal-pop {
        0% {
          opacity: 0;
          transform: scale(0.4) rotate(-8deg);
        }
        100% {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }

      #results-medal.bronze {
        color: #b0703a;
      }

      #results-medal.silver {
        color: #8b9fb3;
      }

      #results-medal.gold {
        color: #d99a1f;
      }

      #results-next-medal {
        font-size: 15px;
        font-weight: 800;
        color: var(--sky-deep);
      }

      .pause-title {
        margin: 0;
        font-size: 30px;
        font-weight: 900;
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="stage"></div>

    <div id="hud" hidden>
      <div id="topbar">
        <div id="remaining-chip" class="chip">
          <span id="remaining">50</span><span class="chip-sub">left</span>
        </div>
        <div id="timer" class="chip">00:00.0</div>
        <button id="pause-btn" class="icon-btn" type="button" aria-label="Pause">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <rect x="2" y="1" width="5" height="16" rx="2" fill="currentColor" />
            <rect x="11" y="1" width="5" height="16" rx="2" fill="currentColor" />
          </svg>
        </button>
      </div>
      <div id="streak-chip" class="chip hud-chip" hidden>×2</div>
      <div id="pace-chip" class="chip hud-chip" hidden>+0.0 s</div>
      <div id="daily-chip" class="chip" hidden>DAILY</div>
    </div>

    <div id="streak-pop" hidden></div>

    <div id="screen-menu" class="screen">
      <div class="card">
        <h1 class="logo">Tissue <span>Rush</span></h1>
        <p class="tagline">Empty the box as fast as you can!</p>
        <div id="size-row">
          <button class="size-btn" data-size="25" type="button">
            <span class="size-num">25</span>
            <span class="size-label">tissues</span>
            <span class="size-best" id="best-25"></span>
            <span class="medal-dot" id="medal-25"></span>
          </button>
          <button class="size-btn" data-size="50" type="button">
            <span class="size-num">50</span>
            <span class="size-label">tissues</span>
            <span class="size-best" id="best-50"></span>
            <span class="medal-dot" id="medal-50"></span>
          </button>
          <button class="size-btn" data-size="100" type="button">
            <span class="size-num">100</span>
            <span class="size-label">tissues</span>
            <span class="size-best" id="best-100"></span>
            <span class="medal-dot" id="medal-100"></span>
          </button>
        </div>
        <button id="btn-daily" class="btn btn-daily btn-big" type="button">
          Daily Sprint
          <span id="daily-streak-label" class="daily-tag" hidden></span>
          <span id="daily-done-badge" class="daily-tag" hidden>✓ done</span>
        </button>
        <button id="btn-blitz" class="btn btn-blitz btn-big" type="button">
          Blitz — 30 s score attack
        </button>
        <div id="skin-row" aria-label="Box skins"></div>
        <p id="menu-stats" hidden></p>
        <p class="howto">
          Grab the tissue and swipe UP. Let go past the stretch point to rip it
          free — too short and it snaps back! Every 20th tissue is golden.
        </p>
      </div>
    </div>

    <div id="screen-countdown" class="screen" hidden>
      <div class="card">
        <p id="count-size">Round of 50</p>
        <p id="count-num">3</p>
        <p id="count-hint">Timer starts on your first grab!</p>
      </div>
    </div>

    <div id="screen-pause" class="screen" hidden>
      <div class="card">
        <h2 class="pause-title">Paused</h2>
        <button id="btn-resume" class="btn btn-big" type="button">Resume</button>
        <button id="btn-pause-restart" class="btn btn-secondary btn-big" type="button">
          Restart
        </button>
        <button id="btn-pause-menu" class="btn btn-secondary btn-big" type="button">Menu</button>
      </div>
    </div>

    <div id="screen-results" class="screen" hidden>
      <div class="card">
        <h2 id="results-title">Box empty!</h2>
        <div id="results-time">00:00.0</div>
        <div id="results-avg"></div>
        <div id="results-delta" hidden></div>
        <div id="results-medal" hidden></div>
        <div id="results-next-medal" hidden></div>
        <div id="results-size"></div>
        <div id="results-best"></div>
        <div id="results-daily-best" hidden></div>
        <div id="results-daily-streak" hidden></div>
        <button id="btn-replay" class="btn btn-big" type="button">Replay</button>
        <button id="btn-results-menu" class="btn btn-secondary btn-big" type="button">Menu</button>
      </div>
    </div>
  </body>
</html>
