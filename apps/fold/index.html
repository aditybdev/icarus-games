<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3ecdc" />
    <title>Fold</title>
    <script src="https://www.youtube.com/game_sdk/v0"></script>
    <style>
      :root {
        --bg: #f3ecdc;
        --paper: #f8f2e6;
        --panel: #fffaf0;
        --ink: #4a3f30;
        --muted: #8a7358;
        --terra: #c96f4a;
        --terra-dark: #b25a37;
        --sage: #7d9b76;
        --line: rgba(160, 130, 95, 0.4);
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 16px;
        overscroll-behavior: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #scene {
        position: absolute;
        inset: 0;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      /* ---------- buttons ---------- */
      .btn {
        min-height: 48px;
        min-width: 48px;
        padding: 10px 18px;
        border: 1.5px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        color: var(--ink);
        font-family: inherit;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 2px 0 rgba(120, 90, 50, 0.12);
        transition: transform 0.08s ease, background 0.15s ease;
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .btn.primary {
        background: var(--terra);
        border-color: var(--terra-dark);
        color: #fff8ef;
      }
      .btn.icon {
        padding: 10px 16px;
        font-size: 22px;
        line-height: 1;
      }
      .btn.pulse {
        animation: pulse-btn 0.9s ease-in-out 3;
      }
      @keyframes pulse-btn {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(201, 111, 74, 0);
        }
        50% {
          box-shadow: 0 0 0 8px rgba(201, 111, 74, 0.25);
        }
      }

      /* ---------- HUD ---------- */
      #hud {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: calc(8px + var(--sat)) calc(10px + var(--sar)) 8px calc(10px + var(--sal));
        pointer-events: none;
      }
      #hud .btn {
        pointer-events: auto;
      }
      #hud-title {
        flex: 1;
        text-align: center;
        font-size: 16px;
        font-weight: 700;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #hud .hud-actions {
        display: flex;
        gap: 8px;
      }
      #hud .hud-actions .btn {
        padding: 10px 12px;
        font-size: 14px;
      }

      /* ---------- screens ---------- */
      .screen {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab))
          calc(16px + var(--sal));
      }
      .screen.overlay {
        background: rgba(74, 63, 48, 0.28);
        backdrop-filter: blur(3px);
      }
      .panel {
        background: var(--panel);
        border: 1.5px solid var(--line);
        border-radius: 22px;
        box-shadow: 0 14px 40px rgba(96, 68, 36, 0.22);
        padding: 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        max-width: min(480px, 100%);
        max-height: 100%;
      }
      .panel h2 {
        margin: 0;
        font-size: 22px;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }

      /* ---------- title ---------- */
      .title-panel .logo {
        font-size: 64px;
        font-weight: 800;
        letter-spacing: 2px;
        color: var(--terra);
        line-height: 1;
      }
      .title-panel .tagline {
        color: var(--muted);
        font-size: 16px;
        margin-top: -8px;
      }
      .title-panel .big {
        min-width: 180px;
        font-size: 18px;
      }
      #total-stars {
        color: var(--muted);
        font-size: 15px;
        min-height: 20px;
      }

      /* ---------- level select ---------- */
      .levels-panel {
        width: min(520px, 100%);
      }
      .levels-head {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
      }
      .levels-head h2 {
        flex: 1;
        text-align: center;
        margin-right: 60px;
      }
      #level-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        width: 100%;
        overflow-y: auto;
        padding: 2px;
      }
      .level-cell {
        aspect-ratio: 1;
        min-height: 48px;
        border: 1.5px solid var(--line);
        border-radius: 14px;
        background: var(--paper);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        cursor: pointer;
        font-family: inherit;
        color: var(--ink);
        padding: 4px;
      }
      .level-cell:active {
        transform: scale(0.95);
      }
      .level-cell.locked {
        opacity: 0.45;
        cursor: default;
      }
      .cell-num {
        font-size: 17px;
        font-weight: 700;
      }
      .cell-stars {
        font-size: 11px;
        color: var(--terra);
        letter-spacing: 1px;
      }
      .cell-lock {
        color: var(--muted);
        display: flex;
      }

      /* ---------- results ---------- */
      #results-stars {
        font-size: 46px;
        color: var(--terra);
        letter-spacing: 6px;
        line-height: 1;
      }
      #results-stats {
        color: var(--muted);
        font-size: 15px;
      }

      /* ---------- toast ---------- */
      #toast {
        position: absolute;
        left: 50%;
        bottom: calc(28px + var(--sab));
        transform: translateX(-50%);
        background: rgba(74, 63, 48, 0.92);
        color: #fff8ef;
        border-radius: 999px;
        padding: 12px 22px;
        font-size: 15px;
        max-width: min(90%, 420px);
        text-align: center;
        pointer-events: none;
      }

      @media (max-width: 420px) {
        .panel {
          padding: 20px;
        }
        .title-panel .logo {
          font-size: 52px;
        }
        #hud .hud-actions .btn {
          padding: 10px 9px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div id="hud" hidden>
        <button class="btn icon" id="btn-menu" aria-label="Menu">‹</button>
        <div id="hud-title">Fold</div>
        <div class="hud-actions">
          <button class="btn" id="btn-undo">Undo</button>
          <button class="btn" id="btn-hint">Hint 3</button>
          <button class="btn" id="btn-reset">Reset</button>
        </div>
      </div>

      <div class="screen" id="screen-title">
        <div class="panel title-panel">
          <div class="logo">Fold</div>
          <div class="tagline">a calm origami puzzle</div>
          <button class="btn primary big" id="btn-play">Play</button>
          <div id="total-stars"></div>
        </div>
      </div>

      <div class="screen" id="screen-levels" hidden>
        <div class="panel levels-panel">
          <div class="levels-head">
            <button class="btn icon" id="btn-levels-back" aria-label="Back">‹</button>
            <h2>Levels</h2>
          </div>
          <div id="level-grid"></div>
        </div>
      </div>

      <div class="screen overlay" id="screen-results" hidden>
        <div class="panel results-panel">
          <h2 id="results-title">Level complete</h2>
          <div id="results-stars"></div>
          <div id="results-stats"></div>
          <div class="row">
            <button class="btn" id="btn-retry">Retry</button>
            <button class="btn" id="btn-results-menu">Menu</button>
            <button class="btn primary" id="btn-next">Next</button>
          </div>
        </div>
      </div>

      <div class="screen overlay" id="screen-pause" hidden>
        <div class="panel">
          <h2>Paused</h2>
          <div class="row">
            <button class="btn primary" id="btn-resume">Resume</button>
            <button class="btn" id="btn-pause-menu">Menu</button>
          </div>
        </div>
      </div>

      <div id="toast" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
