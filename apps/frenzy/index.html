<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#7ec8ff" />
  <link rel="icon" href="data:," />
  <title>Four-Leg Frenzy</title>
  <script src="https://www.youtube.com/game_sdk/v0"></script>
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --green: #58a83c;
      --green-dark: #3f7f2a;
      --cream: #fff7e6;
      --ink: #3a2a18;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: "Trebuchet MS", "Comic Sans MS", "Segoe UI", system-ui, sans-serif;
      background: #7ec8ff; color: var(--ink);
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      font-size: 16px;
    }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    .screen {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      padding: calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal));
      z-index: 30; text-align: center;
    }
    .hidden { display: none !important; }

    /* ---------- countdown ---------- */
    #countdown {
      position: fixed; inset: 0; z-index: 25; pointer-events: none;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(4rem, 18vw, 9rem); font-weight: 900; color: var(--cream);
      text-shadow: 0 4px 0 #2e6e1e, 0 8px 0 rgba(0,0,0,.25), 0 12px 26px rgba(0,0,0,.35);
    }
    .hint-line { font-size: .85rem; font-weight: 700; color: rgba(58,42,24,.65); }
    body.touch .hint-line { display: none; }

    .btn {
      min-height: 64px; min-width: 220px; padding: 12px 28px;
      font-size: 1.25rem; font-weight: 800; font-family: inherit;
      color: #fff; background: var(--green);
      border: none; border-radius: 18px; cursor: pointer;
      box-shadow: 0 5px 0 var(--green-dark), 0 8px 14px rgba(0,0,0,.25);
      transition: transform .06s ease, box-shadow .06s ease;
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--green-dark); }
    .btn.secondary { background: #8a6f4d; box-shadow: 0 5px 0 #6b5638, 0 8px 14px rgba(0,0,0,.25); }
    .btn.secondary:active { box-shadow: 0 1px 0 #6b5638; }

    /* ---------- title ---------- */
    #screen-title { background: linear-gradient(rgba(126,200,255,0) 55%, rgba(46,110,30,.35)); justify-content: flex-end; padding-bottom: calc(28px + var(--sab)); }
    .logo {
      font-size: clamp(2rem, 8vw, 3.6rem); font-weight: 900; letter-spacing: .02em;
      color: var(--cream); text-shadow: 0 3px 0 #2e6e1e, 0 6px 0 rgba(0,0,0,.25), 0 10px 22px rgba(0,0,0,.3);
      line-height: 1.05;
    }
    .tagline { font-size: 1.05rem; font-weight: 700; color: #215214; text-shadow: 0 1px 0 rgba(255,255,255,.5); }
    #best-line { font-size: .95rem; font-weight: 700; color: #215214; min-height: 1.2em; }
    .howto {
      max-width: 560px; font-size: .95rem; font-weight: 600; color: var(--ink);
      background: rgba(255,247,230,.92); border-radius: 14px; padding: 10px 16px;
      box-shadow: 0 3px 8px rgba(0,0,0,.2);
    }
    #btn-settings {
      position: fixed; top: calc(10px + var(--sat)); right: calc(10px + var(--sar));
      width: 52px; height: 52px; min-width: 0; border-radius: 14px; z-index: 40;
      display: flex; align-items: center; justify-content: center; padding: 0;
    }
    #btn-settings svg { width: 28px; height: 28px; }

    /* ---------- HUD ---------- */
    #hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: calc(8px + var(--sat)) calc(10px + var(--sar)) 8px calc(10px + var(--sal));
      pointer-events: none;
    }
    .chip {
      background: rgba(255,247,230,.92); border-radius: 12px; padding: 6px 12px;
      font-size: .95rem; font-weight: 800; box-shadow: 0 2px 6px rgba(0,0,0,.2);
      display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    #dist-bar { flex: 1 1 140px; min-width: 120px; height: 22px; background: rgba(255,247,230,.92);
      border-radius: 11px; overflow: hidden; position: relative; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
    #dist-fill { position: absolute; inset: 0 auto 0 0; width: 0%; background: linear-gradient(90deg, #58a83c, #8ccb66); border-radius: 11px; }
    #dist-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: .8rem; font-weight: 900; color: var(--ink); }
    /* sliding rank-pace carets: where you must be NOW for S/A/B */
    .caret { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px;
      border-radius: 1px; box-shadow: 0 0 0 1px rgba(58,42,24,.35); }
    #caret-s { background: #ffb400; }
    #caret-a { background: #b8b8c8; }
    #caret-b { background: #cd7f32; }

    /* ---------- drama chips (fade in/out — no flashing) ---------- */
    #penalty-chip {
      position: fixed; top: calc(50px + var(--sat)); right: calc(70px + var(--sar));
      z-index: 22; pointer-events: none;
      background: #c0392b; color: #fff; font-weight: 900; font-size: 1.05rem;
      border-radius: 12px; padding: 6px 14px; box-shadow: 0 3px 8px rgba(0,0,0,.3);
      opacity: 0; transition: opacity .22s ease;
    }
    #toast {
      position: fixed; top: calc(88px + var(--sat)); left: 50%; transform: translateX(-50%);
      z-index: 22; pointer-events: none; white-space: nowrap;
      background: rgba(255,247,230,.95); color: var(--ink); font-weight: 900; font-size: 1.3rem;
      letter-spacing: .04em; border-radius: 14px; padding: 8px 20px;
      box-shadow: 0 4px 12px rgba(0,0,0,.3);
      opacity: 0; transition: opacity .22s ease;
    }
    #penalty-chip.show, #toast.show { opacity: 1; }
    #btn-pause {
      pointer-events: auto; margin-left: auto;
      width: 48px; height: 48px; min-width: 0; border-radius: 12px; padding: 0;
      font-size: 1.2rem; line-height: 1; display: flex; align-items: center; justify-content: center;
    }

    /* ---------- leg pad ---------- */
    #legpad {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      display: flex; flex-direction: column; gap: 10px; align-items: center;
      padding: 10px calc(12px + var(--sar)) calc(10px + var(--sab)) calc(12px + var(--sal));
    }
    .pad-row { display: flex; gap: 10px; width: 100%; max-width: 460px; }
    .legbtn {
      flex: 1 1 0; min-height: 64px; height: clamp(64px, 11vh, 96px);
      border: none; border-radius: 16px; cursor: pointer; font-family: inherit;
      background: rgba(255,247,230,.94); color: var(--ink);
      box-shadow: 0 5px 0 #c9b48c, 0 7px 12px rgba(0,0,0,.25);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 1.15rem; font-weight: 900; position: relative;
      touch-action: none; transition: transform .05s ease, box-shadow .05s ease, background .05s ease;
    }
    .legbtn svg { width: 30px; height: 30px; flex: none; }
    .legbtn.down { background: #ffd94a; transform: translateY(4px); box-shadow: 0 1px 0 #c9a23c; }
    .leg-key {
      position: absolute; top: 4px; right: 8px; font-size: .72rem; font-weight: 800;
      background: rgba(58,42,24,.15); border-radius: 6px; padding: 1px 6px;
    }
    body.touch .leg-key { display: none; }

    /* ---------- overlays ---------- */
    .overlay { background: rgba(30,60,20,.55); backdrop-filter: blur(3px); z-index: 35; }
    .panel {
      background: var(--cream); border-radius: 22px; padding: 26px 30px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,.35); max-width: min(92vw, 440px); width: 100%;
    }
    .panel h2 { font-size: 1.7rem; font-weight: 900; }
    #results-rank {
      font-size: 4.2rem; font-weight: 900; line-height: 1;
      color: var(--green); text-shadow: 0 3px 0 var(--green-dark);
    }
    #results-best {
      font-size: 1rem; font-weight: 900; color: #b3541e;
      background: #ffe1b3; border-radius: 10px; padding: 4px 14px;
    }
    #results-rankup {
      font-size: 1rem; font-weight: 900; color: #fff;
      background: var(--green); border-radius: 10px; padding: 4px 14px;
      box-shadow: 0 3px 0 var(--green-dark);
    }
    #results-ladder { font-size: .85rem; font-weight: 800; color: rgba(58,42,24,.7); }
    #results-stats { font-size: 1.05rem; font-weight: 700; line-height: 1.6; }
    .setrow {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      width: 100%; font-size: 1.05rem; font-weight: 800; padding: 6px 2px;
    }
    .setrow input { width: 26px; height: 26px; accent-color: var(--green); }

    @media (max-width: 520px) {
      html, body { font-size: 14px; }
      .btn { min-width: 190px; font-size: 1.1rem; }
      .chip { font-size: .85rem; padding: 5px 9px; }
    }
    @media (orientation: portrait) {
      #legpad { max-width: 520px; margin: 0 auto; }
      .legbtn { height: clamp(64px, 9vh, 84px); }
    }
    /* Short landscape phones: shrink the pad so it doesn't cover the track. */
    @media (orientation: landscape) and (max-height: 480px) {
      #legpad { gap: 6px; padding-top: 6px; padding-bottom: calc(6px + var(--sab)); }
      .legbtn { height: 52px; min-height: 52px; }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="countdown" class="hidden">3</div>

  <div id="hud" class="hidden">
    <div id="dist-bar"><div id="dist-fill"></div><div class="caret hidden" id="caret-s"></div><div class="caret hidden" id="caret-a"></div><div class="caret hidden" id="caret-b"></div><div id="dist-text">0.0 m</div></div>
    <div class="chip" id="hud-timer">90.0</div>
    <div class="chip" id="hud-speed">0.0 m/s</div>
    <div class="chip hidden" id="hud-pace">pace: —</div>
    <div class="chip" id="hud-falls">Falls 0</div>
    <button class="btn" id="btn-pause" aria-label="Pause">II</button>
  </div>

  <div id="penalty-chip" class="hidden">+3 s</div>
  <div id="toast" class="hidden"></div>

  <div id="legpad" class="hidden">
    <div class="pad-row">
      <button class="legbtn" id="leg-0" aria-label="Front left leg">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3a2a18" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v7l4 4v6"/><path d="M13 20h5"/></svg>
        <span>FL</span><span class="leg-key">Q</span>
      </button>
      <button class="legbtn" id="leg-1" aria-label="Front right leg">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3a2a18" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v7l4 4v6"/><path d="M13 20h5"/></svg>
        <span>FR</span><span class="leg-key">W</span>
      </button>
    </div>
    <div class="pad-row">
      <button class="legbtn" id="leg-2" aria-label="Back left leg">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3a2a18" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3v7l-4 4v6"/><path d="M11 20H6"/></svg>
        <span>BL</span><span class="leg-key">O</span>
      </button>
      <button class="legbtn" id="leg-3" aria-label="Back right leg">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3a2a18" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3v7l-4 4v6"/><path d="M11 20H6"/></svg>
        <span>BR</span><span class="leg-key">P</span>
      </button>
    </div>
  </div>

  <div id="screen-title" class="screen">
    <div class="logo">Four-Leg<br />Frenzy</div>
    <div class="tagline">Wobble. Stomp. Stampede-ish.</div>
    <div id="best-line"></div>
    <button class="btn" id="btn-race">Race 50 m</button>
    <button class="btn secondary" id="btn-train">Training</button>
    <div class="howto">Hold a leg to swing it forward, release to stomp. Alternate diagonals — FL+BR then FR+BL — for maximum wobble-speed!</div>
  </div>
  <button class="btn secondary hidden" id="btn-settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h.01a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
  </button>

  <div id="screen-results" class="screen overlay hidden">
    <div class="panel">
      <h2 id="results-title">Finished!</h2>
      <div id="results-rank">S</div>
      <div id="results-ladder" class="hidden"></div>
      <div id="results-best" class="hidden">NEW BEST!</div>
      <div id="results-rankup" class="hidden">RANK UP!</div>
      <div id="results-stats"></div>
      <button class="btn" id="btn-retry">Retry</button>
      <div class="hint-line">Press R or Enter to retry</div>
      <button class="btn secondary" id="btn-results-menu">Menu</button>
    </div>
  </div>

  <div id="screen-pause" class="screen overlay hidden">
    <div class="panel">
      <h2>Paused</h2>
      <button class="btn" id="btn-resume">Resume</button>
      <button class="btn secondary" id="btn-pause-restart">Restart</button>
      <button class="btn secondary" id="btn-pause-settings">Settings</button>
      <button class="btn secondary" id="btn-pause-menu">Menu</button>
    </div>
  </div>

  <div id="screen-settings" class="screen overlay hidden">
    <div class="panel">
      <h2>Settings</h2>
      <label class="setrow">Reduced camera motion <input type="checkbox" id="set-motion" /></label>
      <label class="setrow">Sound effects <input type="checkbox" id="set-sfx" checked /></label>
      <button class="btn" id="btn-settings-close">Done</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
